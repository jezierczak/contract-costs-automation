<div class="fixed inset-0 bg-black/40 z-50 flex justify-center items-start pt-10">

    <div class="bg-white w-[700px] max-h-[90vh] rounded-xl shadow-xl flex flex-col">

        <!-- HEADER -->
        <div class="p-4 border-b flex justify-between items-center">

            <div>
                <h2 class="text-lg font-semibold">
                    {{ title }}
                </h2>
                <p class="text-sm text-gray-500">
                    Edycja danych firmy
                </p>
            </div>

            <button
                type="button"
                {% if picker_target %}
                hx-get="/companies/picker?target={{ picker_target }}"
                hx-target="#modal-area"
                hx-swap="innerHTML"
                {% else %}
                onclick="document.getElementById('modal-area').innerHTML=''"
                {% endif %}
                class="text-gray-500 hover:text-black text-xl leading-none"
            >
                ×
            </button>

        </div>

        <!-- BODY -->
        <div class="p-6 overflow-y-auto">

            {% include "companies/_form.html" %}

        </div>

    </div>

</div>
