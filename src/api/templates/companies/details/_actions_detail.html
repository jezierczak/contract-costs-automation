

    <div class="flex items-center justify-between">

        <!-- BACK -->
        <button  hx-get="/companies"
                hx-target="#content-area"
                hx-swap="innerHTML"
                hx-push-url="true"
                 hx-indicator="#global-indicator"
          class="inline-flex items-center gap-2 px-2 py-1 rounded text-sm text-gray-500 hover:text-gray-800 hover:bg-gray-100">
            ← Powrót do firm
        </button>

        <!-- TITLE -->
        <h2 class="text-2xl font-bold text-gray-800">
            {{ company.name }}
        </h2>

        <!-- TYPE -->
        <div class="text-sm text-gray-500">
            Typ:
            <span class="font-medium text-gray-700">
                {{ company.role.value }}
            </span>
        </div>

    </div>

    {% if not company.is_active %}
    <div class="mt-2 text-right">
        <span class="px-2 py-1 text-sm bg-red-100 text-red-700 rounded">
            Nieaktywna
        </span>
    </div>
    {% endif %}
