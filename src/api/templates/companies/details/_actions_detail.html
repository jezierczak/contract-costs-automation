<div class="flex items-center justify-between">

    <!-- LEFT -->
    <button  
        hx-get="/companies"
        hx-target="#content-area"
        hx-swap="innerHTML"
        hx-push-url="true"
        hx-indicator="#global-indicator"
        class="inline-flex items-center gap-2 px-2 py-1 rounded text-sm text-gray-500 hover:text-gray-800 hover:bg-gray-100"
    >
        ← Powrót do firm
    </button>

    <!-- CENTER -->
    <h2 class="text-2xl font-bold text-gray-800 text-center">
        {{ company.name }}
        {% if company.verification_status.value == "to_verify" %}
        <span class="ml-2 inline-block rounded bg-amber-100 px-1.5 py-0.5 text-xs font-medium text-amber-800" title="Firma założona z niepewnych danych – uzupełnij i zapisz formularz">do weryfikacji</span>
        {% endif %}
    </h2>

    <!-- RIGHT -->
    <div class="flex flex-col items-end gap-1">

        <!-- TYPE -->
        <div class="text-sm text-gray-500">
            Typ:
            <span class="font-medium text-gray-700">
                {{ company.role.value }}
            </span>
        </div>

        <!-- ACTIONS -->
        <div class="flex gap-2">

            <button
                hx-get="/records/edit?buyer_tax_number={{ company.tax_number }}"
                hx-target="#content-area"
                hx-swap="innerHTML"
                hx-push-url="true"
                class="bg-green-600 text-white px-3 py-1.5 rounded hover:bg-green-700 text-sm"
            >
                + Przychód
            </button>

            <button
                hx-get="/records/edit?seller_tax_number={{ company.tax_number }}"
                hx-target="#content-area"
                hx-swap="innerHTML"
                hx-push-url="true"
                class="bg-red-600 text-white px-3 py-1.5 rounded hover:bg-red-700 text-sm"
            >
                + Koszt
            </button>

        </div>

    </div>

</div>
