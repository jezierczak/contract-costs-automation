{% extends "base.html" %}

{% block content %}

<div class="max-w-6xl mx-auto">

    <div class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-bold">
            Firmy
        </h1>
        <div class="flex items-center gap-2">
            <a href="/companies/new"
                class="inline-flex items-center bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">
               + Dodaj firmę
            </a>
            <a href="/companies/new-owner"
               class="inline-flex items-center bg-gray-100 border border-gray-300 text-gray-700 px-4 py-2 rounded hover:bg-gray-300">
              + Dodaj własną firmę
            </a>

        </div>

    </div>
    <form method="get" class="mb-4 flex gap-3">

<input
    name="search"
    value="{{ search or '' }}"
    placeholder="Szukaj..."
    class="border rounded px-3 py-2">

<select name="role" class="border rounded px-3 py-2">
    <option value="">Wszystkie</option>

    {% for r in company_types %}
        <option value="{{ r.value }}"
            {% if role == r.value %}selected{% endif %}>
            {{ r.value }}
        </option>
    {% endfor %}
</select>

<label class="flex items-center gap-2">
    <input type="checkbox" name="inactive" value="1"
        {% if inactive %}checked{% endif %}>
    Nieaktywne
</label>

<button class="bg-blue-600 text-white px-4 rounded">
    Filtruj
</button>

</form>


    <div>

        <!-- LEWA STRONA -->
       <div id="companies-table">
<!--             hx-get="/companies/table"-->
<!--             hx-trigger="load, companies-changed from:body"-->
<!--             hx-target="this"-->
<!--             hx-swap="outerHTML">-->

            {% include "companies/_table.html" %}
        </div>
    </div>

</div>

{% endblock %}
