{% extends "base.html" %}

{% block content %}
<div class="flex items-center justify-between mb-6">

    <!-- LEFT -->
    <a href="/contracts"
       class="text-sm text-gray-600 hover:underline">
        ← Powrót do listy
    </a>


    <!-- RIGHT ACTIONS -->
    <div class="flex gap-2">

        <a href="/contracts/{{ contract.contract_id }}/edit"
           class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
            ✏️ Edytuj
        </a>

        <a href="/contracts/{{ contract.contract_id }}/progress"
           class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">
            📊 Progress
        </a>

    </div>

</div>
<div class="max-w-6xl mx-auto">

    <h1 class="text-2xl font-bold mb-2">
        {{ contract.code }} — {{ contract.name }}
    </h1>

  <div class="mb-6">

<form
    hx-post="/contracts/{{ contract.contract_id }}/status"
    hx-target="this"
    hx-swap="outerHTML"
    class="flex items-center gap-2 text-sm"
>

    <span class="text-gray-500">Status:</span>

    <select
    name="status"
    onchange="this.form.requestSubmit()"
    class="
        border rounded px-2 py-1
        {% if contract.status == 'ACTIVE' %}
            bg-green-50 text-green-700
        {% elif contract.status == 'PLANNED' %}
            bg-blue-50 text-blue-700
        {% elif contract.status == 'DONE' %}
            bg-gray-100 text-gray-600
        {% endif %}
    "
>

        {% for s in statuses %}
        <option
            value="{{ s }}"
            {% if s == contract.status %}selected{% endif %}
        >
            {{ s }}
        </option>
        {% endfor %}

    </select>

</form>

</div>

    {% if contract.description %}
    <div class="mb-6 text-gray-700">
        {{ contract.description }}
    </div>
    {% endif %}

    <h3 class="text-lg font-semibold mb-3">
        Struktura kontraktu
    </h3>

    {% include "contracts/_details_tree.html" %}

</div>

{% endblock %}
