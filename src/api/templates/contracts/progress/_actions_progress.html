{% set back_url = "/contracts/" ~ contract.contract_id if contract|default(None) else "/contracts" %}
<div class="grid grid-cols-3 items-center">

    <!-- BACK -->
    <div>
        <button
            hx-get="{{ back_url }}"
            hx-target="#content-area"
            hx-swap="innerHTML"
            hx-push-url="true"
            hx-indicator="#global-indicator"
            class="inline-flex items-center gap-2 px-2 py-1 rounded text-sm text-gray-500 hover:text-gray-800 hover:bg-gray-100"
        >
            ← Powrót do kontraktu
        </button>
    </div>

     <!-- CENTER -->
    <div class="text-center">
        <h1 class="text-2xl font-bold text-gray-800">
            Aktualizacja progresu
        </h1>
    </div>

        <!-- RIGHT -->
    <div class="flex justify-end">
        <!-- przyszłe akcje -->
    </div>

</div>
