<div class="flex items-center justify-between gap-4">

    <h1 class="text-2xl font-bold">
        Finanse firm
    </h1>

    <div class="flex items-center gap-2">
        {% if selected_company_id %}
        <button
            hx-get="/companies/{{ selected_company_id }}/metadata-modal"
            hx-target="#modal-area"
            hx-swap="innerHTML"
            class="inline-flex items-center rounded border border-gray-300 bg-white px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 leading-none"
        >
            Dane firmy
        </button>
        {% endif %}

        <button
            hx-get="/companies/new-owner"
            hx-target="#modal-area"
            hx-swap="innerHTML"
            class="inline-flex items-center rounded bg-green-600 px-4 py-2 text-sm text-white hover:bg-green-700 leading-none"
        >
            + Dodaj wlasna firme
        </button>
    </div>

</div>
