<div class="flex items-center gap-4">

<!-- ===================== -->
<!-- FIRMY -->
<!-- ===================== -->

<div class="flex gap-2">

{% for company in owner_companies %}

<button
    hx-get="/own-company-finances?company_id={{ company.id }}&year={{ dashboard.year }}"
    hx-target="#content-area"
    hx-swap="innerHTML"
    hx-push-url="true"
    hx-indicator="#global-indicator"
    class="
        px-4 py-1.5
        rounded
        text-sm
        border
        {% if company.id == selected_company_id %}
            bg-gray-800 text-white border-gray-800
        {% else %}
            bg-white hover:bg-gray-100 border-gray-300
        {% endif %}
    "
>
    {{ company.name }}

</button>

{% endfor %}

</div>


<!-- ===================== -->
<!-- WYBÓR ROKU -->
<!-- ===================== -->

<div class="ml-auto">

<select
    class="border rounded px-2 py-1 text-sm"
    hx-get="/own-company-finances"
    hx-target="#content-area"
    hx-swap="innerHTML"
    hx-push-url="true"
    hx-indicator="#global-indicator"
    hx-include="[name=company_id]"
    name="year"
>

{% for y in range(current_year, current_year-6, -1) %}

<option
    value="{{ y }}"
    {% if y == dashboard.year %}selected{% endif %}
>
    {{ y }}
</option>

{% endfor %}

</select>

<input
    type="hidden"
    name="company_id"
    value="{{ selected_company_id }}"
>

</div>

</div>
