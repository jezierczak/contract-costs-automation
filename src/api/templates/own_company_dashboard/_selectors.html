<div class="mb-4 flex flex-wrap items-end justify-between gap-3 rounded-xl bg-white p-4 shadow">

    <div class="flex flex-wrap gap-2">
        {% for company in owner_companies %}
        <button
            hx-get="/own-company-finances?company_id={{ company.id }}&year={{ dashboard.year }}"
            hx-target="#content-area"
            hx-swap="innerHTML"
            hx-push-url="true"
            hx-indicator="#global-indicator"
            class="
                rounded border px-4 py-1.5 text-sm
                {% if company.id == selected_company_id %}
                    border-gray-800 bg-gray-800 text-white
                {% else %}
                    border-gray-300 bg-white text-gray-700 hover:bg-gray-100
                {% endif %}
            "
        >
            {{ company.name }}
        </button>
        {% endfor %}
    </div>

    <div class="flex items-center gap-2">
        <input
            type="hidden"
            name="company_id"
            value="{{ selected_company_id }}"
        >

        <label class="text-xs font-medium uppercase tracking-wide text-gray-500">Rok</label>
        <select
            class="rounded border border-gray-300 px-3 py-2 text-sm"
            hx-get="/own-company-finances"
            hx-target="#content-area"
            hx-swap="innerHTML"
            hx-push-url="true"
            hx-indicator="#global-indicator"
            hx-include="[name=company_id]"
            name="year"
        >
            {% for y in range(current_year, current_year - 6, -1) %}
            <option value="{{ y }}" {% if y == dashboard.year %}selected{% endif %}>
                {{ y }}
            </option>
            {% endfor %}
        </select>
    </div>

</div>
