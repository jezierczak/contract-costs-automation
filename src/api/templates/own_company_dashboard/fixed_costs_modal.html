<div class="fixed inset-0 bg-black/40 flex items-center justify-center z-50">

<div class="bg-white rounded-xl shadow-xl w-[900px] max-h-[80vh] overflow-y-auto">

<!-- HEADER -->

<div class="flex justify-between items-center border-b px-6 py-4">

<h2 class="text-lg font-semibold">
Koszty stałe
</h2>

<button
onclick="this.closest('.fixed').remove()"
class="text-gray-500 hover:text-black text-xl"
>
×
</button>

</div>

<!-- BODY -->

<div class="p-6 space-y-6">

{% for vt in data.value_types %}

<div class="border rounded-lg">

<!-- VALUE TYPE HEADER -->

<div class="bg-gray-50 px-4 py-2 flex justify-between font-semibold">

<span>
{{ vt.value_type_name }}
</span>

<span>
{{ vt.total }}
</span>

</div>

<!-- RECORDS -->

<div class="px-4 py-2 space-y-1 text-sm text-gray-600">

{% for r in vt.records %}

<div class="flex justify-between">

<span>
{{ r.record_date }} — {{ r.item_name }}{% if r.description %} ({{ r.description }}){% endif %}
</span>

<span>
{{ r.amount }}
</span>

</div>

{% endfor %}

</div>

</div>

{% endfor %}

</div>

<!-- FOOTER -->

<div class="border-t px-6 py-4 flex justify-between font-semibold">

<span>
Suma
</span>

<span>
{{ data.total }}
</span>

</div>

</div>

</div>
