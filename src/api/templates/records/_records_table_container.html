
{% extends "workspace.html" %}
{% block workspace_content %}
<div id="records-table"
     hx-get="/records/company?company_id={{company_id}}&year={{year}}{% if month %}&month={{month}}{% endif %}"
     hx-trigger="every 8s, recordsUpdated from:body"
     hx-swap="outerHTML"
     hx-target ="#workspace"
     hx-sync="this:replace"

>

    {% include "records/_table.html" %}

</div>

{% endblock %}
