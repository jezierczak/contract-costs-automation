<div class="grid grid-cols-3 items-center">

    <!-- LEFT -->
    <div>
         <button
            onclick="
                const target = sessionStorage.getItem('records.return_to');
                if (target) {
                    sessionStorage.removeItem('records.return_to');
                    if (window.htmx) {
                        window.history.pushState({}, '', target);
                        window.htmx.ajax('GET', target, {
                            target: '#content-area',
                            swap: 'innerHTML'
                        });
                    } else {
                        window.location.href = target;
                    }
                    return;
                }
                history.back();
            "
        >
            ← Powrót
        </button>
    </div>

    <!-- CENTER -->
    <div class="text-center">
        <h1 class="text-2xl font-bold text-gray-800">

            {% if record %}
                Edycja rekordu
            {% else %}
                Nowy rekord
            {% endif %}

        </h1>
    </div>

    <!-- RIGHT -->
    <div class="flex justify-end gap-2">

        <button
            form="record-edit-form"
            type="submit"
            class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700"
        >
            ✔ Zapisz
        </button>

    </div>

</div>
