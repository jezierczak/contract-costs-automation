<tr class="border-t" data-line="{{ idx }}">

<td colspan="11" class="p-3">

<div class="grid gap-2">

    <!-- ===================== -->
    <!-- ROW 1 ECONOMIC -->
    <!-- ===================== -->
    <div class="grid grid-cols-9 gap-1">

        <input
            name="lines[{{ idx }}].item_name"
            class="border rounded p-1 text-sm"
            placeholder="Nazwa pozycji"
            required
        >

        <input
            name="lines[{{ idx }}].description"
            class="border rounded p-1 text-sm col-span-2"
            placeholder="Opis"
        >

        <input
            name="lines[{{ idx }}].quantity"
            class="border rounded p-1 text-sm"
            required
        >

        <select name="lines[{{ idx }}].unit"
                class="border rounded p-1 text-sm">
            {% for u in units %}
            <option value="{{ u.value }}">{{ u.value }}</option>
            {% endfor %}
        </select>

        <input
            name="lines[{{ idx }}].amount"
            class="border rounded p-1 text-sm"
        >

        <select name="lines[{{ idx }}].vat_rate"
                class="border rounded p-1 text-sm">
            {% for v in vat_rates %}
            <option value="{{ v.value }}">{{ v.value }}</option>
            {% endfor %}
        </select>

        <select name="lines[{{ idx }}].amount_type"
                class="border rounded p-1 text-sm">
            {% for t in amount_types %}
            <option value="{{ t.value }}">{{ t.value }}</option>
            {% endfor %}
        </select>

        <select name="lines[{{ idx }}].tax_treatment"
                class="border rounded p-1 text-sm">
            {% for tt in tax_treatments %}
            <option value="{{ tt.value }}">{{ tt.value }}</option>
            {% endfor %}
        </select>

    </div>

    <!-- ===================== -->
    <!-- ROW 2 INTERNAL -->
    <!-- ===================== -->
    <div class="grid grid-cols-5 gap-2">

        <!-- CONTRACT -->
        <select
                name="lines[{{ idx }}].contract_id"
                class="border rounded p-1 text-sm"
                hx-get="/records/contracts/nodes"
                hx-trigger="change"
                hx-target="#contract-node-slot-{{ idx }}"
                hx-swap="innerHTML"
                hx-vals='js:{
                    contract_id:this.value,
                    idx:"{{ idx }}",
                    field_name:"contract_node_id",
                    label:"Contract node"
                }'
            >
            <option value="">Kontrakt</option>
            {% for c in contracts %}
            <option value="{{ c.contract_id }}">
                {{ c.code }}
            </option>
            {% endfor %}
        </select>

        <!-- CONTRACT NODE -->
        <div id="contract-node-slot-{{ idx }}">
            <select
                name="lines[{{ idx }}].contract_node_id"
                class="border rounded p-1 text-sm"
            >
                <option value="">Contract node</option>
            </select>
        </div>

        <!-- VALUE TYPE -->
        <select
            name="lines[{{ idx }}].value_type_id"
            class="border rounded p-1 text-sm"
        >
            <option value="">Value type</option>
            {% for v in value_types %}
            <option value="{{ v.id }}">{{ v.code }}</option>
            {% endfor %}
        </select>

        <!-- AGREEMENT -->
        <select
            name="lines[{{ idx }}].agreement_id"
            class="border rounded p-1 text-sm"
            hx-get="/records/contracts/nodes"
            hx-trigger="change"
            hx-target="#agreement-node-slot-{{ idx }}"
            hx-swap="innerHTML"
           hx-vals='js:{contract_id:event.target.value,idx:"{{ idx }}",field_name:"agreement_node_id",label:"Agreement node"}'
            >
            <option value="">Agreement</option>
            {% for a in agreements %}
            <option value="{{ a.contract_id }}">
                {{ a.code }}
            </option>
            {% endfor %}
        </select>

        <!-- AGREEMENT NODE -->
        <div id="agreement-node-slot-{{ idx }}">
            <select
                name="lines[{{ idx }}].agreement_node_id"
                class="border rounded p-1 text-sm"
            >
                <option value="">Agreement node</option>
            </select>
        </div>

    </div>

    <!-- ===================== -->
    <!-- ACTION -->
    <!-- ===================== -->
    <div class="flex justify-end">

     <button
    type="button"
    onclick="if(confirm('Usunąć linię?')) this.closest('tr').remove()"
    class="text-red-600 hover:underline text-sm"
>
    🗑 Usuń linię
</button>

    </div>

</div>

</td>
</tr>
