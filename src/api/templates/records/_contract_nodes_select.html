<select
    name="lines[{{ idx }}].{{ field_name }}"
    class="border rounded p-1 text-sm"
>
    <div class="bg-red-200">DEBUG NODES {{ nodes|length }}</div>
    <option value="">{{ label }}</option>

    {% for n in nodes %}
    <option
        value="{{ n.id }}"
        {% if selected_node_id|string == n.id|string %}selected{% endif %}
    >
        {{ "--" * n.depth }} {{ n.code }}
    </option>
    {% endfor %}
</select>
