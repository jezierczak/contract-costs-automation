<div class="flex items-center gap-2">
    <select
        name="lines[{{ idx }}].{{ field_name }}"
        class="w-full border rounded p-1 text-sm"
    >
        <option value="">{{ label }}</option>

        {% for n in nodes %}
        <option
            value="{{ n.id }}"
            {% if selected_node_id|string == n.id|string %}selected{% endif %}
        >
            {{ "--" * n.depth }} {{ n.code }}
        </option>
        {% endfor %}
    </select>

    {% if field_name == "contract_node_id" %}
    <button
        type="button"
        onclick="fillContractNodeToRemainingLines({{ idx }})"
        class="shrink-0 rounded border border-gray-300 px-2 py-1 text-xs font-medium text-gray-700 hover:bg-gray-100"
        title="Wypełnij kolejne linie tym samym contract node"
    >
        Dalej
    </button>
    {% endif %}
</div>
