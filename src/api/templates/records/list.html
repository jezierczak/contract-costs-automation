{% extends "workspace.html" %}

{% block workspace_content %}

<div class="max-w-[95vw] mx-auto">

    <h1 class="text-2xl font-bold mb-6">
        Financial Records
    </h1>

    <div id="records-table"
         hx-get="/records/table/{{view.value}}"
         hx-trigger="load, every 3s,  recordsUpdated from:body"
         hx-swap="innerHTML">

        {% include "records/_table.html" %}

    </div>

</div>

{% endblock %}
