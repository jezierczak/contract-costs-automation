<div class="fixed inset-0 z-50 flex justify-center bg-black/40 pt-10">
    <div class="flex max-h-[90vh] w-fit min-w-[620px] max-w-[95vw] flex-col overflow-hidden rounded-xl bg-white shadow-xl">
        <div class="flex items-center justify-between border-b p-4">
            <div>
                <h2 class="text-lg font-semibold">Wybierz contract node</h2>
                <p class="text-sm text-gray-500">Wybierz node. W polu zostanie tylko kod.</p>
            </div>

            <button
                type="button"
                onclick="document.getElementById('modal-area').innerHTML=''"
                class="text-xl leading-none text-gray-500 hover:text-black"
            >
                X
            </button>
        </div>

        <div class="overflow-auto p-4">
            <div class="grid gap-2">
                {% for node in nodes %}
                <button
                    type="button"
                    hx-get="/records/contracts/nodes/select?idx={{ idx }}&contract_id={{ contract_id }}&selected_node_id={{ node.id }}"
                    hx-target="#contract-node-slot-{{ idx }}"
                    hx-swap="outerHTML"
                    hx-on::after-request="document.getElementById('modal-area').innerHTML=''"
                    class="rounded-lg border px-4 py-3 text-left hover:border-blue-300 hover:bg-blue-50 {% if selected_node_id|string == node.id|string %}border-blue-500 bg-blue-50{% else %}border-gray-200{% endif %}"
                >
                    <div class="font-medium text-gray-900">{{ "--" * node.depth }} {{ node.code }}</div>
                    <div class="mt-1 text-xs text-gray-600">{{ node.name or "Brak nazwy" }}</div>
                </button>
                {% else %}
                <div class="rounded-lg border border-dashed border-gray-200 px-4 py-6 text-sm text-gray-400">
                    Brak aktywnych leaf node dla tego kontraktu.
                </div>
                {% endfor %}
            </div>
        </div>
    </div>
</div>
