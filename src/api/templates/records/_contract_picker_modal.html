<div class="fixed inset-0 z-50 flex justify-center bg-black/40 pt-10">
    <div class="flex max-h-[90vh] w-fit min-w-[620px] max-w-[95vw] flex-col overflow-hidden rounded-xl bg-white shadow-xl">
        <div class="flex items-center justify-between border-b p-4">
            <div>
                <h2 class="text-lg font-semibold">Wybierz kontrakt</h2>
                <p class="text-sm text-gray-500">Wybierz kontrakt. W polu zostanie tylko kod.</p>
            </div>

            <button
                type="button"
                onclick="document.getElementById('modal-area').innerHTML=''"
                class="text-xl leading-none text-gray-500 hover:text-black"
            >
                X
            </button>
        </div>

        <div class="overflow-auto p-4">
            <div class="grid gap-2">
                {% for contract in contracts %}
                <button
                    type="button"
                    hx-get="/records/contracts/select?idx={{ idx }}&contract_id={{ contract.contract_id }}"
                    hx-target="#contract-slot-{{ idx }}"
                    hx-swap="outerHTML"
                    hx-on::after-request="document.getElementById('modal-area').innerHTML=''; refreshContractNodeSlot('{{ idx }}', '{{ contract.contract_id }}', null)"
                    class="rounded-lg border px-4 py-3 text-left hover:border-blue-300 hover:bg-blue-50 {% if selected_contract_id|string == contract.contract_id|string %}border-blue-500 bg-blue-50{% else %}border-gray-200{% endif %}"
                >
                    <div class="font-medium text-gray-900">{{ contract.code }}</div>
                    <div class="mt-1 text-xs text-gray-600">{{ contract.name or contract.contract_name or "Brak nazwy" }}</div>
                </button>
                {% else %}
                <div class="rounded-lg border border-dashed border-gray-200 px-4 py-6 text-sm text-gray-400">
                    Brak kontraktow.
                </div>
                {% endfor %}
            </div>
        </div>
    </div>
</div>
