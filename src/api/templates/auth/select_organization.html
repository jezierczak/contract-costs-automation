{% extends "base.html" %}

{% block content %}
<h2>Wybierz organizację</h2>

<form method="post" action="/select-organization"  hx-boost="false">
    <select name="organization_id">
        {% for org in organizations %}
            <option value="{{ org.organization_id }}">
                {{ org.organization_name }}
            </option>
        {% endfor %}
    </select>

    <button type="submit">Wejdź</button>
</form>
{% endblock %}
