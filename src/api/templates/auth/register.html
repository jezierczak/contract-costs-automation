{% extends "base.html" %}

{% block content %}

<div class="flex items-center justify-center min-h-[70vh]">

<div class="w-full max-w-md bg-white p-8 rounded-xl shadow">

<h2 class="text-2xl font-bold mb-6 text-center">
    Rejestracja organizacji
</h2>

<form
    hx-post="/register"
    hx-target="#result"
    hx-swap="innerHTML"
    class="space-y-4"
>


<!-- ORGANIZATION -->

<input type="text"
       name="organization_code"
       placeholder="Kod organizacji (np. REMONTIVO)"
       required
       class="w-full border border-gray-300 rounded px-3 py-2">

<input type="text"
       name="organization_name"
       placeholder="Pełna nazwa organizacji"
       required
       class="w-full border border-gray-300 rounded px-3 py-2">

<!-- USER -->

<input type="text"
       name="login"
       placeholder="Login"
       required
       class="w-full border border-gray-300 rounded px-3 py-2">

<input type="text"
       name="full_name"
       placeholder="Imię i nazwisko (opcjonalnie)"
       class="w-full border border-gray-300 rounded px-3 py-2">

<input type="email"
       name="email"
       placeholder="Email (opcjonalnie)"
       class="w-full border border-gray-300 rounded px-3 py-2">

<!-- PASSWORD -->

<input type="password"
       name="password"
       placeholder="Hasło"
       required
       class="w-full border border-gray-300 rounded px-3 py-2">

<input type="password"
       name="password_repeat"
       placeholder="Powtórz hasło"
       required
       class="w-full border border-gray-300 rounded px-3 py-2">

<button type="submit"
        class="w-full bg-green-600 text-white rounded py-2 hover:bg-green-700">
    Utwórz konto
</button>

</form>


<div id="result" class="mt-4 text-center"></div>

</div>
</div>

{% endblock %}
