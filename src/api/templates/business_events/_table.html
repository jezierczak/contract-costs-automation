<div class="space-y-2">

{% for e in events %}

<div class="
    p-3 rounded-lg border text-sm
    {% if e.level == 'SUCCESS' %}
        bg-green-50 border-green-200
    {% elif e.level == 'ERROR' %}
        bg-red-50 border-red-200
    {% else %}
        bg-gray-50 border-gray-200
    {% endif %}
">

    <div class="flex items-start justify-between gap-3">

        <!-- LEFT -->
        <div class="flex-1">

            {% if e.entity_type == "document" %}
                <a
                    hx-get="/documents/{{ e.entity_id }}/match"
                    hx-target="#content-area"
                    hx-swap="innerHTML"
                    hx-push-url="true"
                    hx-on::after-request="document.getElementById('modal-area').innerHTML = ''"
                    class="text-blue-700 hover:underline font-medium"
                >
                    {{ e.message }}
                </a>
            {% elif  e.entity_type == "record" %}
                <a
                    hx-get="/records/{{ e.entity_id }}/review"
                    hx-target="#modal-area"
                    hx-swap="innerHTML"
                    class="text-blue-700 hover:underline font-medium"
                >
                    {{ e.message }}
                </a>

            {% elif  e.entity_type == "value_type" %}
                <a
                    hx-get="/value_types/{{ e.entity_id }}/review"
                    hx-target="#modal-area"
                    hx-swap="innerHTML"
                    class="text-blue-700 hover:underline font-medium"
                >
                    {{ e.message }}
                </a>

            {% else %}
                <span class="font-medium">
                    {{ e.message }}
                </span>
            {% endif %}

        </div>

        <!-- RIGHT -->
        <span class="text-xs text-gray-500 whitespace-nowrap">
            {{ e.created_at }}
        </span>

    </div>

</div>

{% endfor %}

</div>
