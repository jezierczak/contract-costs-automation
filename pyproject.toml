[project]
name = "contract-costs-automation"
version = "0.8.5"
description = "Production-grade system for tracking, aggregating, and auditing construction contract costs using hierarchical cost trees and historical snapshots."

requires-python = ">=3.13"
dependencies = [
    "argon2-cffi>=25.1.0",
    "cryptography>=46.0.3",
    "fastapi>=0.129.0",
    "jinja2>=3.1.6",
    "ksef-client[fa3,qr,xml]>=0.17.1",
    "lxml>=6.0.2",
    "mysql-connector-python>=9.6.0",
    "openai>=2.21.0",
    "opencv-python>=4.13.0.92",
    "openpyxl>=3.1.5",
    "pandas>=3.0.1",
    "pandas-stubs~=3.0.0",
    "passlib[argon2]>=1.7.4",
    "pdf2image>=1.17.0",
    "pdfplumber>=0.11.9",
    "pydantic>=2.12.5",
    "pytesseract>=0.3.13",
    "python-dotenv>=1.2.1",
    "python-multipart>=0.0.22",
    "uvicorn[standard]>=0.41.0",
    "watchdog>=6.0.0",
    "xhtml2pdf>=0.2.17",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "alembic>=1.18.4",
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "testcontainers[mysql]>=4.13.1",
    "types-openpyxl>=3.1.5.20250919",
]
