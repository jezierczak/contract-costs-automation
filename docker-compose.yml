version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: contract_costs_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  app:
    build: .
    container_name: contract_costs_app
    restart: unless-stopped
    environment:
      APP_ENV: prod
      TZ: Europe/Warsaw
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - /app/.venv
      - ./.env.docker:/app/.env.prod:ro
    depends_on:
      - mysql

volumes:
  mysql_data:
